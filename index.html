<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Copa Fabio Iglesias 2026 · Zona Centro</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap"><style>
/* Plan de diseño: torneo de pádel de empresa. Paleta FPY (azul, carbón) + dorado Carrán; titulares en condensada deportiva, cuerpo en grotesca humanista.
   Layout: franja superior con logos y pestañas fijas, contenido en tarjetas sobre fondo frío; tablero de canchas como pieza central. */
:root {
  --bg: #F3F5F8; --surface: #FFFFFF; --surface2: #F8F9FB; --ink: #1B2331; --muted: #5C6678; --line: #DCE1E9;
  --blue: #0F52A0; --blue-ink: #0F52A0; --blue-soft: #E4EDF8; --gold: #9A722E; --gold-fill: #C39A5B; --gold-soft: #F7EEDC;
  --ok: #1B7F55; --ok-soft: #DFF2E8; --warn: #A66A00; --warn-soft: #FBEFD3; --bad: #B3321F; --bad-soft: #FADFDA;
  --shadow: 0 1px 2px rgba(20,30,50,.06), 0 4px 14px rgba(20,30,50,.05);
  --f-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --f-body: 'Barlow', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D131B; --surface: #151D29; --surface2: #1A2331; --ink: #E7ECF3; --muted: #9AA7B9; --line: #263246;
    --blue: #3D86DB; --blue-ink: #7DB2F0; --blue-soft: #15283F; --gold: #D6B070; --gold-fill: #C39A5B; --gold-soft: #2B2315;
    --ok: #4DC08E; --ok-soft: #12301F; --warn: #E0A647; --warn-soft: #332612; --bad: #F08A78; --bad-soft: #3A1E19;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D131B; --surface: #151D29; --surface2: #1A2331; --ink: #E7ECF3; --muted: #9AA7B9; --line: #263246;
  --blue: #3D86DB; --blue-ink: #7DB2F0; --blue-soft: #15283F; --gold: #D6B070; --gold-fill: #C39A5B; --gold-soft: #2B2315;
  --ok: #4DC08E; --ok-soft: #12301F; --warn: #E0A647; --warn-soft: #332612; --bad: #F08A78; --bad-soft: #3A1E19;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.25); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); padding-inline: 16px; padding-block: 0 40px; margin: 0; }
button, input, select { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; line-height: 1.1; }
h2 { font-size: 28px; } h3 { font-size: 21px; } h4 { font-size: 16px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.wrap { max-width: 1240px; margin: 0 auto; }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.tn { font-variant-numeric: tabular-nums; }

/* cabecera */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 10px 6px; margin-inline: -16px; padding-inline: 16px; border-bottom: 1px solid var(--line); }
.top-in { max-width: 1240px; margin: 0 auto; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.plate { background: #fff; border-radius: 8px; padding: 4px 8px; display: flex; border: 1px solid var(--line); }
.plate img { height: 34px; width: auto; display: block; }
.title { font-family: var(--f-display); font-size: 26px; font-weight: 700; line-height: 1; letter-spacing: .02em; text-transform: uppercase; }
.title small { display: block; font-family: var(--f-body); font-size: 12px; font-weight: 500; letter-spacing: .04em; color: var(--muted); text-transform: none; margin-top: 3px; }
.top-r { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.nav { max-width: 1240px; margin: 8px auto 0; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.nav button { white-space: nowrap; border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 14px; }
.nav button[aria-current="page"] { background: var(--blue); border-color: var(--blue); color: #fff; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--blue-soft); color: var(--blue-ink); }
.chip.ok { background: var(--ok-soft); color: var(--ok); } .chip.warn { background: var(--warn-soft); color: var(--warn); } .chip.bad { background: var(--bad-soft); color: var(--bad); } .chip.gold { background: var(--gold-soft); color: var(--gold); }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; }
.btn:hover { border-color: var(--blue); }
.btn.pri { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.gold { background: var(--gold-fill); border-color: var(--gold-fill); color: #1B1405; }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

main { max-width: 1240px; margin: 18px auto 0; display: grid; gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card > h3 + * { margin-top: 12px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.row.sp { justify-content: space-between; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 7px 14px; cursor: pointer; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--blue-soft); color: var(--blue-ink); }

/* hero */
.hero { background: linear-gradient(120deg, #0B3F7E 0%, #0F52A0 55%, #2467B3 100%); color: #fff; border-radius: 12px; padding: 22px; display: grid; gap: 16px; position: relative; overflow: hidden; }
.hero::after { content: ''; position: absolute; right: -40px; top: -40px; width: 220px; height: 220px; border: 26px solid rgba(214,176,112,.9); border-radius: 50%; }
.hero h2 { font-size: 40px; text-transform: uppercase; } .hero .sub { opacity: .9; max-width: 56ch; }
.hero .dates { display: flex; gap: 10px; flex-wrap: wrap; position: relative; z-index: 1; }
.hero .d { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3); padding: 8px 14px; border-radius: 10px; }
.hero .d b { display: block; font-family: var(--f-display); font-size: 22px; letter-spacing: .02em; }
.stat { display: grid; gap: 2px; text-align: center; justify-items: center; }
.stat .bar { width: 100%; }
.stat .v { font-family: var(--f-display); font-size: 40px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .l { color: var(--muted); font-size: 13px; }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; } .bar > i { display: block; height: 100%; background: var(--blue); }

/* canchas */
.courts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.court { border: 1px solid var(--line); border-radius: 10px; background: var(--surface2); padding: 10px 12px; display: grid; gap: 6px; min-height: 108px; }
.court .cn { font-family: var(--f-display); font-weight: 700; color: var(--blue-ink); font-size: 14px; letter-spacing: .08em; text-transform: uppercase; display: flex; justify-content: space-between; }
.court.live { border-color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok); }
.court .vs { font-weight: 600; line-height: 1.25; }
.court .vs span { display: block; }
.court .vs .x { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }

/* partidos */
.block { display: grid; gap: 8px; }
.block-h { display: flex; align-items: baseline; gap: 10px; border-bottom: 2px solid var(--blue); padding-bottom: 4px; margin-top: 8px; }
.block-h .t { font-family: var(--f-display); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.mgrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.match { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; display: grid; grid-template-columns: 44px 1fr; min-width: 0; overflow: hidden; }
.match .cb { background: var(--blue-soft); color: var(--blue-ink); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 26px; border-right: 1px solid var(--line); }
.match.F .cb { background: var(--gold-soft); color: var(--gold); }
.match.live { border-color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok); }
.match .mb { padding: 8px 10px; display: grid; gap: 4px; min-width: 0; }
.match .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.side { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; min-width: 0; }
.side .nm { overflow-wrap: anywhere; line-height: 1.2; font-weight: 600; }
.side.win .nm { color: var(--ok); } .side.lose .nm { color: var(--muted); font-weight: 500; }
.ref { color: var(--muted); font-style: italic; font-weight: 500; }
.sc { width: 46px; text-align: center; border: 1px solid var(--line); border-radius: 6px; background: var(--surface2); padding: 5px 2px; font-family: var(--f-display); font-size: 20px; font-weight: 700; }
.scv { font-family: var(--f-display); font-size: 24px; font-weight: 700; min-width: 28px; text-align: right; }
.win-btns { display: flex; gap: 6px; font-size: 12px; align-items: center; color: var(--warn); flex-wrap: wrap; }

/* tablas */
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 8px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; white-space: nowrap; }
td.n, th.n { text-align: center; }
tr.q td:first-child { box-shadow: inset 4px 0 0 var(--ok); }
tr.q3 td:first-child { box-shadow: inset 4px 0 0 var(--gold-fill); }
tr.out td { opacity: .5; text-decoration: line-through; }
td input[type=text], td input[type=number], .fld { width: 100%; min-width: 90px; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: var(--surface2); }
.fld { padding: 8px 10px; }
label.l { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 600; }

/* sorteo */
.gcard { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.gcard header { background: var(--blue); color: #fff; font-family: var(--f-display); font-weight: 700; font-size: 20px; padding: 6px 12px; display: flex; justify-content: space-between; letter-spacing: .03em; text-transform: uppercase; }
.gcard.F header { background: var(--gold-fill); color: #1B1405; }
.gcard ol { margin: 0; padding: 6px 10px; list-style: none; display: grid; gap: 4px; min-height: 140px; align-content: start; }
.gcard li { display: grid; grid-template-columns: 24px 1fr; gap: 6px; padding: 5px 4px; border-bottom: 1px dashed var(--line); font-weight: 600; }
.gcard li .p { font-family: var(--f-display); color: var(--muted); font-size: 17px; }
.gcard li.pop { animation: pop .5s ease-out; background: var(--gold-soft); }
.star { color: var(--gold-fill); }
@keyframes pop { from { transform: translateY(-8px) scale(1.03); opacity: 0; } to { transform: none; opacity: 1; } }
.bk { border: 1px dashed var(--line); border-radius: 10px; padding: 10px; background: var(--surface2); }
.bk h4 { margin-bottom: 6px; } .bk div { padding: 2px 0; }

/* llaves */
.bracket { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 1fr); gap: 16px; overflow-x: auto; padding-bottom: 8px; align-items: center; }
.col { display: grid; gap: 14px; align-content: center; }
.col h4 { text-align: center; }
.podium { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; align-items: end; }
.pod { border-radius: 10px; padding: 14px; text-align: center; background: var(--surface2); border: 1px solid var(--line); display: grid; gap: 4px; }
.pod .m { font-family: var(--f-display); font-size: 44px; font-weight: 700; line-height: 1; }
.pod.p1 { background: var(--gold-soft); border-color: var(--gold-fill); padding-block: 26px; } .pod.p1 .m { color: var(--gold); font-size: 58px; }
.pod .t { font-weight: 700; } .pod .pl { font-size: 13px; color: var(--muted); }
.note { padding: 10px 12px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-size: 14px; }
.note.ok { background: var(--ok-soft); color: var(--ok); } .note.bad { background: var(--bad-soft); color: var(--bad); } .note.info { background: var(--blue-soft); color: var(--blue-ink); }
.foot { max-width: 1240px; margin: 30px auto 0; display: grid; gap: 10px; justify-items: center; }
.foot .plate { padding: 6px 14px; max-width: 100%; } .foot .plate img { height: auto; width: min(100%, 420px); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600; z-index: 50; max-width: 90vw; }
body.screen .adm { display: none !important; }
body.screen { font-size: 17px; }
@media (max-width: 560px) { .hero h2 { font-size: 32px; } .title { font-size: 21px; } .plate img { height: 28px; } }
@media (prefers-reduced-motion: reduce) { .gcard li.pop { animation: none; } }

.rules { margin: 8px 0 0; padding-left: 20px; } .rules li { margin: 6px 0; line-height: 1.45; }

.tl { cursor: pointer; text-decoration: underline dotted; text-decoration-color: var(--muted); text-underline-offset: 3px; }
.tpop { position: fixed; z-index: 9999; background: #1d2733; color: #fff; padding: 9px 12px; border-radius: 8px; font-size: 14px; line-height: 1.5; max-width: 260px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }

/* banner del torneo */
.banner { display: block; width: 100%; height: auto; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
.hero::after { display: none; }

/* ganador resaltado (claro también en empate por tie break) */
.side.win { background: var(--ok-soft); border-radius: 8px; box-shadow: inset 3px 0 0 var(--ok); padding: 3px 6px; margin: 0 -6px; }
.side.win .scv { color: var(--ok); }
.chip.tbw { display: inline-block; margin-left: 6px; font-size: 11px; white-space: nowrap; vertical-align: middle; }

/* gran final: marcador a dos sets */
.sets { display: inline-flex; gap: 4px; align-items: center; }
.sc.ss { width: 40px; font-size: 18px; }
.sc.stbi { width: 50px; font-size: 14px; }
.sc.ss::placeholder { font-size: 11px; font-weight: 500; color: var(--muted); }

.seg { max-width: 100%; overflow-x: auto; }
main > * { min-width: 0; max-width: 100%; }

.hero .venue { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; position: relative; z-index: 1; color: #fff; text-decoration: none; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3); padding: 10px 14px; border-radius: 10px; width: fit-content; max-width: 100%; }
.hero .venue:hover, .hero .venue:focus-visible { background: rgba(255,255,255,.24); }
.hero .venue svg { color: #D6B070; flex: none; }
.hero .venue b { display: block; font-family: var(--f-display); font-size: 22px; letter-spacing: .02em; line-height: 1.1; }
.hero .venue .go { margin-left: auto; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* acceso de organización: arriba en computador; en celular, discreto al final de la página */
.login-foot { display: none; background: none; border: 0; color: var(--muted); font: inherit; font-size: 12px; opacity: .65; text-decoration: underline; padding: 10px; margin-top: 6px; cursor: pointer; }
@media (max-width: 700px) { .login-top { display: none; } .login-foot { display: inline-block; } }

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:60;padding:16px}.modal{width:min(380px,100%);display:grid;gap:12px}.btn.ghost{background:transparent}</style></head><body><div id="app"></div><script src="config.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script>/* Motor del torneo — Copa Fabio Iglesias, fase regional zona centro. Funciona en node y en el navegador. */
(function (root) {
  const E = {};

  /* ---------- utilidades ---------- */
  E.hash = function (str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return h >>> 0;
  };
  E.rng = function (seedStr) {
    let a = E.hash(String(seedStr)) || 1;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  E.shuffle = function (arr, rnd) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  };
  E.toMin = s => { const [h, m] = String(s).split(':').map(Number); return h * 60 + (m || 0); };
  E.fmt = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  E.norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
  const LET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  E.groupId = (cat, i) => (cat === 'F' ? 'M-' : '') + LET[i];
  E.groupName = id => 'Grupo ' + id;

  /* tamaños de grupo: máximo 4, lo más parejo posible (27 -> 6x4 + 1x3) */
  E.groupSizes = function (n) {
    if (n <= 0) return [];
    if (n <= 4) return [n];
    const G = Math.ceil(n / 4), base = Math.floor(n / G), rem = n % G;
    return Array.from({ length: G }, (_, i) => base + (i < rem ? 1 : 0));
  };

  /* ---------- revisión de inscripciones ---------- */
  E.validate = function (teams) {
    teams = teams.filter(t => !t.out);
    const out = [];
    const seen = {};
    teams.forEach(t => [t.p1, t.p2].forEach(p => {
      const k = E.norm(p); if (!k) return;
      (seen[k] = seen[k] || []).push(t);
    }));
    Object.entries(seen).forEach(([k, ts]) => {
      const uniq = [...new Set(ts.map(t => t.id))];
      if (uniq.length > 1) out.push({ level: 'error', msg: `Jugador repetido en ${uniq.length} parejas: ${ts[0].p1 && E.norm(ts[0].p1) === k ? ts[0].p1 : ts[0].p2} (${ts.map(t => t.name).join(' / ')})` });
    });
    const names = {};
    teams.forEach(t => { const k = E.norm(t.name); (names[k] = names[k] || []).push(t); });
    Object.values(names).forEach(ts => { if (ts.length > 1) out.push({ level: 'warn', msg: `Nombre de equipo repetido: ${ts[0].name}` }); });
    ['M', 'F'].forEach(cat => {
      const n = teams.filter(t => t.cat === cat).length;
      const sizes = E.groupSizes(n);
      const small = sizes.filter(s => s < 4).length;
      if (n && small) out.push({ level: 'warn', msg: `${cat === 'M' ? 'Hombres' : 'Mujeres'}: ${n} parejas → grupos de ${sizes.join(', ')}. Los grupos de 3 juegan solo 2 partidos.` });
      const seeds = teams.filter(t => t.cat === cat && t.seed).length;
      if (n && seeds === 0) out.push({ level: 'info', msg: `${cat === 'M' ? 'Hombres' : 'Mujeres'}: aún sin cabezas de serie.` });
      else if (n && seeds < sizes.length) out.push({ level: 'info', msg: `${cat === 'M' ? 'Hombres' : 'Mujeres'}: ${seeds} cabezas de serie para ${sizes.length} grupos.` });
    });
    return out;
  };

  /* ---------- sorteo jornada 1 ---------- */
  /* teams de una categoría; seed = ranking 1..n (0/undefined = sin serie). Devuelve grupos y pasos del sorteo. */
  E.drawGroups = function (teams, cat, opts) {
    opts = opts || {};
    const rnd = E.rng(opts.seed + '|J1|' + cat);
    const sizes = E.groupSizes(teams.length);
    const G = sizes.length;
    const forbidden = (opts.forbidden || []).map(p => p.map(String));
    const seeds = teams.filter(t => t.seed).sort((a, b) => a.seed - b.seed);
    const rest = teams.filter(t => !t.seed);
    let best = null;
    for (let attempt = 0; attempt < 3000; attempt++) {
      const groups = sizes.map(() => []);
      const steps = [];
      // cabezas de serie por oleadas: cada oleada cae en grupos distintos
      for (let w = 0; w * G < seeds.length; w++) {
        const wave = seeds.slice(w * G, (w + 1) * G);
        const order = E.shuffle([...Array(G).keys()], rnd);
        wave.forEach((t, i) => { const g = order[i]; groups[g].push(t.id); steps.push({ team: t.id, group: g, seed: true }); });
      }
      const slots = [];
      groups.forEach((g, gi) => { for (let k = g.length; k < sizes[gi]; k++) slots.push(gi); });
      const shuffledSlots = E.shuffle(slots, rnd);
      E.shuffle(rest, rnd).forEach((t, i) => { const g = shuffledSlots[i]; groups[g].push(t.id); steps.push({ team: t.id, group: g, seed: false }); });
      const bad = forbidden.some(([a, b]) => groups.some(g => g.includes(a) && g.includes(b)));
      best = { groups, steps, attempts: attempt + 1 };
      if (!bad) break;
    }
    return {
      groups: best.groups.map((ids, i) => ({ id: E.groupId(cat, i), teams: ids })),
      steps: best.steps, attempts: best.attempts
    };
  };

  /* ---------- fixtures de grupo ---------- */
  E.groupMatches = function (stage, cat, group, dur) {
    const t = group.teams, id = group.id, out = [];
    const rounds = t.length === 4 ? [[[0, 1], [2, 3]], [[0, 2], [1, 3]], [[0, 3], [1, 2]]]
      : t.length === 3 ? [[[0, 1]], [[0, 2]], [[1, 2]]]
      : t.length === 2 ? [[[0, 1]]] : [];
    rounds.forEach((pairs, r) => pairs.forEach((p, k) => out.push({
      id: `${stage}-${id}-${r + 1}${k + 1}`, stage, cat, phase: 'grupos', group: id, round: r + 1,
      a: t[p[0]], b: t[p[1]], pa: p[0] + 1, pb: p[1] + 1, dur
    })));
    return out;
  };

  /* programación por bloques (criterio 2025, jornada 1): cada grupo juega todos sus partidos seguidos.
     Un grupo de 4 ocupa 2 canchas durante 3 rondas seguidas; con 6 canchas juegan 3 grupos a la vez.
     Los grupos con una pareja «temprano» van en el primer bloque; los que tienen una «tarde» van en los últimos. */
  E.scheduleBlocks = function (matches, o) {
    const nC = o.nCourts || 6, early = new Set(o.early || []), late = new Set(o.late || []);
    const G = {}; matches.forEach(m => { const k = m.cat + '|' + m.group; (G[k] = G[k] || { key: k, cat: m.cat, group: m.group, ms: [] }).ms.push(m); });
    const gs = Object.values(G);
    gs.forEach(g => {
      const ids = new Set(); g.ms.forEach(m => { ids.add(m.a); ids.add(m.b); });
      g.pr = [...ids].some(i => early.has(i)) ? 0 : [...ids].some(i => late.has(i)) ? 2 : 1;
      g.need = Math.min(nC, Math.max(...Object.values(g.ms.reduce((a, m) => (a[m.round] = (a[m.round] || 0) + 1, a), {}))));
      g.rounds = Math.max(...g.ms.map(m => m.round));
    });
    if (o.pairs && o.pairs.length) { // jornada 2: se busca el reparto en bloques que deje parejas con descanso parecido antes de las llaves
      const base = gs.slice().sort((x, y) => y.cat.localeCompare(x.cat) || String(x.group).localeCompare(String(y.group)));
      const tot = base.reduce((s, g) => s + g.need, 0), B = Math.max(1, Math.ceil(tot / nC)), idx = Object.fromEntries(base.map((g, i) => [g.key, i]));
      let best = null; const asg = new Array(base.length).fill(0), load = new Array(B).fill(0);
      const rec = i => {
        if (i === base.length) {
          let c = 0; o.pairs.forEach(p => { if (idx[p[0]] != null && idx[p[1]] != null) c += (p[2] || 1) * Math.abs(asg[idx[p[0]]] - asg[idx[p[1]]]); });
          base.forEach((g, k) => { if (B > 1) { if (g.pr === 0 && asg[k] !== 0) c += 1000; if (g.pr === 2 && asg[k] === 0) c += 1000; } });
          if (!best || c < best.c - 1e-9) best = { c, asg: asg.slice() };
          return;
        }
        for (let b = 0; b < B; b++) if (load[b] + base[i].need <= nC) { load[b] += base[i].need; asg[i] = b; rec(i + 1); load[b] -= base[i].need; }
      };
      rec(0);
      if (best) {
        const bl = Array.from({ length: B }, () => ({ used: 0, gs: [] }));
        base.forEach((g, k) => { const b = bl[best.asg[k]]; b.gs.push({ g, c0: b.used }); b.used += g.need; });
        const res = []; let slot = 0;
        bl.forEach(b => {
          b.gs.forEach(({ g, c0 }) => {
            const byR = {}; g.ms.forEach(m => (byR[m.round] = byR[m.round] || []).push(m));
            Object.keys(byR).forEach(r => byR[r].forEach((m, k) => res.push({ id: m.id, slot: slot + (+r - 1), court: c0 + k + 1 })));
          });
          if (b.gs.length) slot += Math.max(...b.gs.map(x => x.g.rounds));
        });
        return { slots: slot, b2b: 0, res, cost: slot * 1000, blocks: best.asg };
      }
    }
    gs.sort((a, b) => a.pr - b.pr || a.cat.localeCompare(b.cat) || String(a.group).localeCompare(String(b.group)));
    // bloques de una hora: en cada uno, un grupo de mujeres y los demás de hombres (igual visibilidad a ambas ramas).
    // El primer bloque lleva a los grupos «temprano»; los «tarde» quedan para el segundo bloque en adelante.
    const order = Object.fromEntries(gs.map((g, i) => [g.key, i])), rem = gs.slice(), blocks = [];
    for (let b = 0; rem.length; b++) {
      const pool = rem.filter(g => b > 0 || g.pr < 2).sort((x, y) => {
        const kx = b === 0 ? x.pr : (x.pr === 2 ? 0 : x.pr === 0 ? 1 : 2), ky = b === 0 ? y.pr : (y.pr === 2 ? 0 : y.pr === 0 ? 1 : 2);
        return kx - ky || order[x.key] - order[y.key];
      });
      const chosen = []; let used = 0;
      const fits = g => used + g.need <= nC && !chosen.includes(g);
      const add = g => { chosen.push(g); used += g.need; rem.splice(rem.indexOf(g), 1); };
      const hasF = () => chosen.some(g => g.cat === 'F');
      pool.forEach(g => { if ((b === 0 ? g.pr === 0 : g.pr === 2) && fits(g) && !(g.cat === 'F' && hasF())) add(g); });
      if (!hasF()) { const f = pool.find(g => g.cat === 'F' && fits(g)); if (f) add(f); }
      pool.forEach(g => { if (g.cat !== 'F' && fits(g)) add(g); });
      pool.forEach(g => { if (fits(g)) add(g); });
      if (!chosen.length) { const g = rem.shift(); chosen.push(g); used = g.need; }
      const f = chosen.find(g => g.cat === 'F'), ms = chosen.filter(g => g !== f);
      blocks.push({ used: 0, gs: (f && ms.length ? [ms[0], f, ...ms.slice(1)] : chosen).map(g => ({ g, c0: 0 })) });
    }
    blocks.forEach(b => { let c = 0; b.gs.forEach(x => { x.c0 = c; c += x.g.need; }); });
    const res = []; let slot = 0;
    blocks.forEach(b => {
      b.gs.forEach(({ g, c0 }) => {
        const byR = {}; g.ms.forEach(m => (byR[m.round] = byR[m.round] || []).push(m));
        Object.keys(byR).forEach(r => byR[r].forEach((m, k) => res.push({ id: m.id, slot: slot + (+r - 1), court: c0 + k + 1 })));
      });
      slot += Math.max(...b.gs.map(x => x.g.rounds));
    });
    return { slots: slot, b2b: 0, res, cost: slot * 1000 };
  };

  /* ---------- programación en canchas ---------- */
  /* asigna slot (bloque de `dur` minutos) y cancha. Minimiza descansos nulos. */
  E.schedule = function (matches, o) {
    const nC = o.nCourts || 6, iters = o.iters || 400;
    const early = new Set(o.early || []), late = new Set(o.late || []), lateMin = o.lateMin == null ? 2 : o.lateMin;
    const isE = m => early.has(m.a) || early.has(m.b), isL = m => late.has(m.a) || late.has(m.b);
    const rnd = E.rng((o.seed || 'x') + '|sched');
    const isEid = {}; matches.forEach(m => { if (isE(m)) isEid[m.id] = 1; });
    let best = null;
    for (let it = 0; it < iters; it++) {
      const rem = matches.slice(), last = {}, res = [];
      let slot = 0, b2b = 0, guard = 0;
      while (rem.length && guard++ < 500) {
        const cands = E.shuffle(rem, rnd).map(m => ({
          m,
          pen: ((last[m.a] === slot - 1) ? 1 : 0) + ((last[m.b] === slot - 1) ? 1 : 0)
        }));
        cands.sort((x, y) => (x.pen - y.pen) || ((isE(y.m) ? 1 : 0) - (isE(x.m) ? 1 : 0)) || (x.m.round - y.m.round));
        const used = new Set(), pick = [];
        for (const c of cands) {
          if (pick.length >= nC) break;
          if (used.has(c.m.a) || used.has(c.m.b)) continue;
          if (slot < lateMin && isL(c.m) && !isE(c.m)) continue; // quienes llegan de lejos no juegan en las primeras rondas
          if (c.pen && it % 2 === 1 && rnd() < 0.35) continue;
          pick.push(c); used.add(c.m.a); used.add(c.m.b);
        }
        pick.sort((x, y) => (x.m.cat + x.m.group).localeCompare(y.m.cat + y.m.group) || x.m.round - y.m.round);
        pick.forEach((c, k) => {
          res.push({ id: c.m.id, slot, court: k + 1 });
          b2b += c.pen; last[c.m.a] = slot; last[c.m.b] = slot;
          rem.splice(rem.indexOf(c.m), 1);
        });
        slot++;
      }
      let eSum = 0; res.forEach(r => { if (isEid[r.id]) eSum += r.slot; });
      const cost = slot * 1000 + b2b * 10 + eSum;
      if (!best || cost < best.cost) best = { cost, slots: slot, b2b, res };
    }
    return best;
  };

  /* ---------- resultados y posiciones ---------- */
  const num = x => (x === '' || x == null || isNaN(+x)) ? null : +x;
  E.winner = function (m, r) {
    if (!r) return null;
    if (m.sets === 2) { // gran final: semifinal, final y 3er lugar a dos sets (1-1 → super tie break)
      const s1a = num(r.s1a), s1b = num(r.s1b), s2a = num(r.s2a), s2b = num(r.s2b);
      if (s1a == null || s1b == null || s2a == null || s2b == null || s1a === s1b || s2a === s2b) return null;
      const wa = (s1a > s1b ? 1 : 0) + (s2a > s2b ? 1 : 0);
      if (wa === 2) return m.a; if (wa === 0) return m.b;
      const ta = num(r.ta), tb = num(r.tb);
      if (ta == null || tb == null || ta === tb) return null;
      return ta > tb ? m.a : m.b;
    }
    if (r.ga === '' || r.gb === '' || r.ga == null || r.gb == null) return null;
    const a = +r.ga, b = +r.gb;
    if (a > b) return m.a; if (b > a) return m.b;
    return r.w === 'a' ? m.a : r.w === 'b' ? m.b : null;
  };
  E.stb = (m, r) => m.sets === 2 && r && num(r.s1a) != null && num(r.s2a) != null && ((num(r.s1a) > num(r.s1b)) !== (num(r.s2a) > num(r.s2b))) && num(r.ta) != null && num(r.tb) != null;
  E.scoreText = function (m, r) {
    if (!r) return '';
    if (m.sets === 2) { const p = [[r.s1a, r.s1b], [r.s2a, r.s2b]].filter(x => num(x[0]) != null && num(x[1]) != null).map(x => x[0] + '-' + x[1]); if (E.stb(m, r)) p.push('STB ' + r.ta + '-' + r.tb); return p.join(' · '); }
    return (r.ga === '' || r.ga == null) ? '' : r.ga + '–' + r.gb;
  };
  E.gamesOf = function (r) { // games efectivos (un empate resuelto por tie-break suma 1 al ganador)
    let a = +r.ga, b = +r.gb;
    if (a === b) { if (r.w === 'a') a++; else if (r.w === 'b') b++; }
    return [a, b];
  };
  E.standings = function (teamIds, matches, results, tb) {
    const rows = {};
    teamIds.forEach(id => rows[id] = { id, pj: 0, pg: 0, pp: 0, jf: 0, jc: 0, dif: 0, tb: (tb && tb[id]) || 0 });
    let done = 0;
    matches.forEach(m => {
      const w = E.winner(m, results[m.id]); if (!w) return;
      done++;
      const [ga, gb] = E.gamesOf(results[m.id]);
      const A = rows[m.a], B = rows[m.b];
      A.pj++; B.pj++; A.jf += ga; A.jc += gb; B.jf += gb; B.jc += ga;
      if (w === m.a) { A.pg++; B.pp++; } else { B.pg++; A.pp++; }
    });
    const list = Object.values(rows);
    list.forEach(r => r.dif = r.jf - r.jc);
    list.sort((x, y) => (y.pg - x.pg) || (y.dif - x.dif) || (y.tb - x.tb));
    list.forEach((r, i) => {
      r.pos = i + 1;
      r.tied = list.some((o, j) => j !== i && o.pg === r.pg && o.dif === r.dif && o.tb === r.tb && (done > 0));
    });
    return { rows: list, done, total: matches.length, complete: done === matches.length };
  };

  /* ranking entre grupos (puede haber grupos de distinto tamaño → se usan promedios) */
  E.rankAcross = function (groupStandings, seed) {
    const all = [];
    groupStandings.forEach(gs => gs.rows.forEach(r => all.push(Object.assign({ group: gs.group }, r))));
    all.forEach(r => {
      r.ratio = r.pj ? r.pg / r.pj : 0;
      r.difAvg = r.pj ? r.dif / r.pj : 0;
      r.rk = E.hash(seed + '|rk|' + r.id);
    });
    all.sort((x, y) => (y.ratio - x.ratio) || (y.difAvg - x.difAvg) || (y.tb - x.tb) || (x.rk - y.rk));
    all.forEach((r, i) => {
      r.rank = i + 1;
      r.tiedRank = all.some((o, j) => j !== i && o.ratio === r.ratio && o.difAvg === r.difAvg && o.tb === r.tb);
    });
    return all;
  };

  /* clasificados: 1°s y 2°s de cada grupo; si faltan, mejores 3°s (y 4°s) */
  E.qualifiers = function (ranked, Q) {
    const take = [];
    for (let pos = 1; pos <= 4 && take.length < Q; pos++) {
      const lvl = ranked.filter(r => r.pos === pos);
      const need = Q - take.length;
      if (pos <= 2) lvl.forEach(r => take.push(r));
      else lvl.slice(0, need).forEach(r => take.push(r));
    }
    take.sort((x, y) => (x.pos - y.pos) || (x.rank - y.rank)); // primeros de grupo primero (cabezas de serie), luego segundos, luego terceros
    return take.slice(0, Q);
  };

  /* ---------- jornada 2: bolilleros ---------- */
  E.drawJ2 = function (qualified, cat, nGroups, o) {
    const rnd = E.rng(o.seed + '|J2|' + cat);
    const ids = qualified.map(q => q.id);
    const origin = {}; qualified.forEach(q => origin[q.id] = q.group);
    const size = nGroups;
    const buckets = []; for (let i = 0; i < ids.length; i += size) buckets.push(ids.slice(i, i + size));
    let best = null, tries = 0;
    for (; tries < 5000; tries++) {
      const groups = Array.from({ length: nGroups }, () => []);
      const steps = [];
      buckets.forEach((b, bi) => {
        const order = E.shuffle([...Array(nGroups).keys()], rnd);
        E.shuffle(b, rnd).forEach((id, k) => { const g = order[k % nGroups]; groups[g].push(id); steps.push({ team: id, group: g, bucket: bi + 1 }); });
      });
      const clash = groups.some(g => g.some((a, i) => g.some((b, j) => j > i && origin[a] === origin[b])));
      best = { groups, steps, clash };
      if (!o.avoidRematch || !clash) break;
    }
    return {
      groups: best.groups.map((tids, i) => ({ id: E.groupId(cat, i), teams: tids })),
      steps: best.steps, buckets, attempts: tries + 1, rematch: best.clash
    };
  };

  /* ---------- llaves ---------- */
  const pos = (cat, g, p) => ({ t: 'pos', cat, group: g, pos: p });
  const W = m => ({ t: 'w', m }), L = m => ({ t: 'l', m });
  E.koDefs = function (cat) {
    if (cat === 'M') return [
      { id: 'QF1', name: 'Cuartos 1', round: 'Cuartos de final', a: pos('M', 'A', 1), b: pos('M', 'B', 2) },
      { id: 'QF2', name: 'Cuartos 2', round: 'Cuartos de final', a: pos('M', 'A', 2), b: pos('M', 'B', 1) },
      { id: 'QF3', name: 'Cuartos 3', round: 'Cuartos de final', a: pos('M', 'C', 1), b: pos('M', 'D', 2) },
      { id: 'QF4', name: 'Cuartos 4', round: 'Cuartos de final', a: pos('M', 'C', 2), b: pos('M', 'D', 1) },
      { id: 'SF1', name: 'Semifinal 1', round: 'Semifinal', a: W('QF1'), b: W('QF3') },
      { id: 'SF2', name: 'Semifinal 2', round: 'Semifinal', a: W('QF2'), b: W('QF4') },
      { id: 'F', name: 'Final', round: 'Final', a: W('SF1'), b: W('SF2') },
      { id: 'T', name: '3er y 4to lugar', round: '3er lugar', a: L('SF1'), b: L('SF2') }
    ];
    return [
      { id: 'SF1', name: 'Semifinal 1', round: 'Semifinal', a: pos('F', 'M-A', 1), b: pos('F', 'M-B', 2) },
      { id: 'SF2', name: 'Semifinal 2', round: 'Semifinal', a: pos('F', 'M-A', 2), b: pos('F', 'M-B', 1) },
      { id: 'F', name: 'Final', round: 'Final', a: W('SF1'), b: W('SF2') },
      { id: 'T', name: '3er y 4to lugar', round: '3er lugar', a: L('SF1'), b: L('SF2') }
    ];
  };

  /* ---------- cupos a la gran final (mayor resto) ---------- */
  E.cupos = function (counts, total, info) {
    const zones = Object.keys(counts), sum = zones.reduce((s, z) => s + counts[z], 0);
    if (!sum) return {};
    // resto exacto en enteros (sin errores de decimales); si empatan, más inscritos; si aún empatan, queda marcado como empate
    const raw = zones.map(z => ({ z, base: Math.floor(counts[z] * total / sum), rem: (counts[z] * total) % sum }));
    const out = {}; let left = total;
    raw.forEach(r => { out[r.z] = r.base; left -= r.base; });
    raw.sort((a, b) => (b.rem - a.rem) || (counts[b.z] - counts[a.z]));
    for (let i = 0; i < left; i++) out[raw[i].z]++;
    if (info) {
      const last = raw[left - 1], next = raw[left];
      info.tie = left > 0 && next && last.rem === next.rem && counts[last.z] === counts[next.z] ? raw.filter(r => r.rem === last.rem && counts[r.z] === counts[last.z]).map(r => r.z) : [];
    }
    return out;
  };


  /* ================= estado del torneo ================= */
  E.defaults = function () {
    return {
      seed: '', nCourts: 6, start: '19:00', d1: '2026-10-15', d2: '2026-10-29', dF: '2026-11-07',
      dur1: 20, dur2: 20, durKO: 40, qM: 16, qF: 8, nG2M: 4, nG2F: 2,
      cuposM: 4, cuposF: 3, avoidRematch: false, forbidden: [], gfStart: '09:30', durG: 30, durGKO: 60, gfRest: 30
    };
  };
  E.newState = function (teams) {
    return { v: 1, settings: E.defaults(), teams: teams || [], j1: null, j2: null, results: {}, tb: {}, log: [] };
  };
  E.teamMap = st => Object.fromEntries(st.teams.concat(st.gfx || []).map(t => [t.id, t]));
  E.stg = (st, stage) => stage === 'J2' ? st.j2 : stage === 'GF' ? st.gf : st.j1;
  E.catName = c => c === 'M' ? 'Hombres' : 'Mujeres';

  /* jornada 1: sorteo + fixtures + horarios */
  E.makeJ1 = function (st, seedStr) {
    const S = st.settings; S.seed = seedStr || S.seed || ('copa-' + Date.now());
    const groups = { M: [], F: [] }, steps = { M: [], F: [] }, matches = [], attempts = {};
    ['M', 'F'].forEach(cat => {
      const ts = st.teams.filter(t => t.cat === cat && !t.out);
      if (!ts.length) return;
      const forb = (S.forbidden || []).filter(p => ts.some(t => t.id === p[0]) && ts.some(t => t.id === p[1]));
      const d = E.drawGroups(ts, cat, { seed: S.seed, forbidden: forb });
      groups[cat] = d.groups; steps[cat] = d.steps; attempts[cat] = d.attempts;
      d.groups.forEach(g => matches.push(...E.groupMatches('J1', cat, g, S.dur1)));
    });
    const sch = E.scheduleBlocks(matches, { nCourts: S.nCourts, early: st.teams.filter(t => t.hor === 'early').map(t => t.id), late: st.teams.filter(t => t.hor === 'late').map(t => t.id) });
    const t0 = E.toMin(S.start), pos = Object.fromEntries(sch.res.map(r => [r.id, r]));
    matches.forEach(m => { const r = pos[m.id]; m.slot = r.slot; m.court = r.court; m.startMin = t0 + r.slot * S.dur1; m.endMin = m.startMin + S.dur1; });
    matches.sort((a, b) => a.startMin - b.startMin || a.court - b.court);
    st.j1 = { groups, steps, matches, attempts, slots: sch.slots, endMin: t0 + sch.slots * S.dur1, drawnAt: new Date().toISOString() };
    st.j2 = null; st.gf = null; st.results = {}; st.tb = {};
    return st;
  };

  /* referencias de llaves */
  E.refText = function (r) {
    if (!r) return '—';
    if (r.t === 'pos') return `${r.pos}° ${E.groupName(r.group)}`;
    return (r.t === 'w' ? 'Ganador ' : 'Perdedor ') + r.m;
  };
  E.j2Group = (st, cat, gid, stage) => { const s = E.stg(st, stage || 'J2'); return s && s.groups[cat].find(g => g.id === gid); };
  E.stand2 = function (st, cat, gid, stage) {
    stage = stage || 'J2';

/* ---------- estado y persistencia ---------- */
function freshState() {
  const st = E.newState(JSON.parse(JSON.stringify(SEED_TEAMS)));
  st.zones = JSON.parse(JSON.stringify(SEED_ZONES)); st.ts = 0; st.updated = null; ensure(st);
  return st;
}
function tryLocal() { try { const j = localStorage.getItem(LSKEY); return j ? JSON.parse(j) : null; } catch (e) { return null; } }
function ensure(st) { st.zones = st.zones || JSON.parse(JSON.stringify(SEED_ZONES)); st.fin = st.fin || { M: { out: [], reps: [] }, F: { out: [], reps: [] } }; ['M', 'F'].forEach(c => { st.fin[c] = st.fin[c] || { out: [], reps: [] }; }); st.tb = st.tb || {}; st.gfx = st.gfx || []; st.results = st.results || {}; st.settings = Object.assign(E.defaults(), st.settings || {}); return st; }
let saveT = null;
function save(res) {
  if (PUBLIC || !edit()) return;
  if (res) dirtyR = true;
  state.ts = Date.now(); state.updated = new Date().toISOString(); lastTs = state.ts;
  clearTimeout(saveT);
  if (DEMO) { try { localStorage.setItem(LSKEY, JSON.stringify(state)); } catch (e) {} return; }
  if (WEB) { dirty = true; pubState = 'pending'; try { localStorage.setItem(LSKEY, JSON.stringify(state)); } catch (e) {} saveT = setTimeout(publish, 400); return; }
  saveT = setTimeout(async () => {
    try { localStorage.setItem(LSKEY, JSON.stringify(state)); } catch (e) {}
    if (dbDoc && org()) {
      try { await dbDoc.set({ json: JSON.stringify(state), ts: state.ts }); syncMode = 'cloud'; }
      catch (e) { syncMode = 'local'; }
      render();
    }
  }, 500);
}
const epochOf = st => (st && st.j1 && st.j1.drawnAt) || '';
async function publish() {
  if (!WEB || !fbDb || !edit() || !dirty) return;
  clearTimeout(saveT);
  if (!online) { pubState = 'err'; render(); return; }
  pubState = 'pending';
  const snapTs = state.ts, wantRes = !org() || dirtyR;
  const res = { json: JSON.stringify({ epoch: epochOf(state), results: state.results, tb: state.tb, updated: state.updated }), ts: state.ts };
  let p;
  if (org()) {
    const s2 = JSON.parse(JSON.stringify(state)); delete s2.results; delete s2.tb;
    const upd = { estado: { json: JSON.stringify(s2), ts: state.ts } };
    if (wantRes) upd.resultados = res;
    p = fbDb.ref().update(upd);
  } else p = fbDb.ref('resultados').set(res);
  try {
    await Promise.race([p, new Promise((_, rj) => setTimeout(() => rj(new Error('timeout')), 12000))]);
    if (state.ts === snapTs) { dirty = false; if (org() && wantRes) dirtyR = false; pubState = 'ok'; lastPub = new Date(); try { localStorage.removeItem(LSKEY + '-dirty'); } catch (e) {} applyRemote(); return; } else { return publish(); }
  } catch (e) { pubState = 'err'; pubErr = String((e && (e.code || e.message)) || ''); try { console.error('publish', e); } catch (x) {} }
  render();
}
setInterval(() => { if (WEB && dirty && pubState !== 'pending') publish(); }, 8000);
function toast(msg) { clearTimeout(toastT); let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); } t.textContent = msg; t.hidden = false; toastT = setTimeout(() => { t.hidden = true; }, 3200); }

/* ---------- utilidades de vista ---------- */
const tm = () => E.teamMap(state);
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const stageDate = st => st === 'J2' ? state.settings.d2 : st === 'GF' ? state.settings.dF : state.settings.d1;
const dlabel = iso => { const d = new Date(iso + 'T12:00:00'); const s = d.toLocaleDateString('es-CL', { weekday: 'long', day: 'numeric', month: 'long' }); return s.charAt(0).toUpperCase() + s.slice(1); };
const shortDate = iso => { const d = new Date(iso + 'T12:00:00'); return d.toLocaleDateString('es-CL', { day: 'numeric', month: 'short' }); };
const stg = st => E.stg(state, st);
const zoneTag = id => { const t = tm()[id]; return t && t.zone ? ` <span class="muted small">(${esc(t.zone)})</span>` : ''; };
const active = cat => state.teams.filter(t => !t.out && (!cat || t.cat === cat));
function isLive(m) { return todayISO() === stageDate(m.stage) && nowMin() >= m.startMin && nowMin() < m.endMin; }
let subPick = null;
function subCard() {
  const s = state.j2, cats = ['M', 'F'].filter(c => (s.groups[c] || []).length), subs = s.subs || [];
  const rows = cats.map(c => `<h4 style="margin:12px 0 4px">${rama(c)}</h4><div class="tbl-wrap"><table><tbody>${s.groups[c].flatMap(g => g.teams.map(id => `<tr><td>${esc(nameOf(id))} <span class="muted small">${esc(E.groupName(g.id))}</span></td><td class="n">${subPick && subPick.out === id ? '' : `<button class="btn sm" data-act="subOut" data-t="${id}">Se baja</button>`}</td></tr>`)).join('')}</tbody></table></div>`).join('');

function gfEntrants(cat) {

function gfStatus() {
  const out = { ok: false, msgs: [] };

    if (n > 0 && n < 5) { bad = true; out.msgs.push(`${rama(cat)}: ${n} parejas; se necesitan al menos 5 para armar 2 grupos.`); }

function startReveal(stage) {
  const s = stg(stage); clearInterval(revealTimer);
  const cats = ['M', 'F'].filter(c => (s.groups[c] || []).length);
  const total = cats.reduce((n, c) => n + s.steps[c].length, 0);
  if (reduce || !total) { reveal = null; return; }
  reveal = { stage, cat: cats[0], n: 0, catDone: {}, done: false, cats };
  revealTimer = setInterval(() => {
    const len = s.steps[reveal.cat].length;
    if (reveal.n < len) reveal.n++;
    else { reveal.catDone[reveal.cat] = true; const i = cats.indexOf(reveal.cat); if (i + 1 < cats.length) { reveal.cat = cats[i + 1]; reveal.n = 0; } else { reveal.done = true; clearInterval(revealTimer); } }
    render();
  }, 260);
}

      const central = uniq.filter(t => t.zone === 'Centro').map(t => Object.assign({ seed: 0 }, t, old[t.id] ? { seed: t.seed || old[t.id].seed || 0, out: old[t.id].out, hor: old[t.id].hor } : {}));

document.addEventListener('change', ev => {

/* ---------- arranque ---------- */
function loadStatic() {
  const load = async () => { try { const r = await fetch('estado.json?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) { state = ensure(await r.json()); setUpdated(); render(); } } catch (e) {} };
  load(); setInterval(load, 60000);
}
function setUpdated() { const d = state.updated ? new Date(state.updated) : null; updatedAt = d ? shortDate(d.toISOString().slice(0, 10)) + ' ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0') : 'sin datos aún'; }
/* respaldo por HTTPS: si la conexión continua de Firebase se duerme o se cae (celulares, redes con filtros), se consulta cada 8 s solo la marca de hora (muy liviano) y se baja el estado completo únicamente si cambió */
let pollBusy = false; const DG = { e: 0, r: 0, poll: 0, pollHit: 0, pollErr: '', conn: null, connAt: 0 };
async function pollRemote() {
  if (!WEB || DEMO || !fbDb || pollBusy || document.hidden) return;
  const base = String((CFG.firebase || {}).databaseURL || '').replace(/\/$/, ''); if (!base) return;
  pollBusy = true;
  try {
    const get = p => fetch(base + p + '.json', { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
    const [a, b] = await Promise.all([get('/estado/ts'), get('/resultados/ts')]); DG.poll = Date.now(); DG.pollErr = '';
    if ((a || 0) !== ((remote.e && remote.e.ts) || 0) || (b || 0) !== ((remote.r && remote.r.ts) || 0)) {
      const [e, r] = await Promise.all([get('/estado'), get('/resultados')]);
      remote.e = e; remote.r = r; remote.eSeen = remote.rSeen = true; booted = true; DG.pollHit = Date.now(); applyRemote();
    }
  } catch (x) { DG.pollErr = String((x && x.message) || x); } finally { pollBusy = false; }
}

if (new URLSearchParams(location.search).get('diag') === '1') {
  const box = document.createElement('div'); box.style.cssText = 'position:fixed;right:8px;bottom:8px;z-index:99999;background:#111;color:#fff;font:12px/1.5 monospace;padding:8px 10px;border-radius:8px;opacity:.92;max-width:290px';
  if (document.body) document.body.appendChild(box); else document.addEventListener('DOMContentLoaded', () => document.body.appendChild(box));
  const ago = t => t ? Math.round((Date.now() - t) / 1000) + ' s' : 'nunca';
  setInterval(() => { box.innerHTML = 'DIAGNÓSTICO<br>Conexión en vivo: <b>' + (DG.conn === null ? '…' : DG.conn ? 'ACTIVA' : 'CAÍDA') + '</b> (hace ' + ago(DG.connAt) + ')<br>Último dato en vivo: estado ' + ago(DG.e) + ' · resultados ' + ago(DG.r) + '<br>Respaldo: revisó hace ' + ago(DG.poll) + ' · trajo cambios hace ' + ago(DG.pollHit) + (DG.pollErr ? '<br>Error respaldo: ' + esc(DG.pollErr) : ''); }, 1000);
}
function bootWeb() {
  const c = CFG.firebase || {};
  const dm = new URLSearchParams(location.search).get('demo');
  if ((!c.apiKey || /PEGAR/.test(c.apiKey)) && (dm === 'org' || dm === 'marcador')) {
    DEMO = true; LSKEY += '-demo'; role = dm;
    state = ensure(tryLocal() || freshState()); render();
    window.addEventListener('storage', e => { if (e.key === LSKEY && e.newValue) { try { state = ensure(JSON.parse(e.newValue)); render(); } catch (x) {} } });
    return;
  }
  if (!c.apiKey || /PEGAR/.test(c.apiKey) || !window.firebase) { loadStatic(); return; }
  try { firebase.initializeApp(c); } catch (e) {}
  fb = firebase; fbDb = fb.database();
  downloads = { save: async ({ filename, data }) => { const u = URL.createObjectURL(data), a = document.createElement('a'); a.href = u; a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { a.remove(); URL.revokeObjectURL(u); }, 1500); } };
  fbDb.ref('.info/connected').on('value', s => { online = !!s.val(); DG.conn = online; DG.connAt = Date.now(); if (online && dirty) publish(); else render(); });
  const orgs = (CFG.organizers || []).map(x => String(x).toLowerCase());
  fb.auth().onAuthStateChanged(u => {
    userEmail = u && u.email ? u.email : '';
    role = !u ? 'viewer' : (orgs.includes(userEmail.toLowerCase()) ? 'org' : 'marcador');
    if (!edit()) screenMode = false;
    if (dirty && edit()) publish();
    reconcileLocal();
    // si la organización entra y aún no hay nada publicado, publica el estado inicial
    if (org() && booted && !remoteExists) { state = ensure(state); dirty = true; dirtyR = true; save(true); }
    render();
  });
  const onSnap = () => { booted = true; applyRemote(); };
  setInterval(pollRemote, 8000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { try { fbDb.goOnline(); } catch (x) {} pollRemote(); } });
  window.addEventListener('online', () => { try { fbDb.goOnline(); } catch (x) {} pollRemote(); });
  fbDb.ref('estado').on('value', snap => { DG.e = Date.now(); remote.e = snap.val(); remote.eSeen = true; if (remote.rSeen) onSnap(); }, () => { loadStatic(); });
  fbDb.ref('resultados').on('value', snap => { DG.r = Date.now(); remote.r = snap.val(); remote.rSeen = true; if (remote.eSeen) onSnap(); }, () => {});
}
/* combina el estado del torneo (solo organización) con los resultados (marcador y organización) */
function combineRemote() {
  const e = remote.e; if (!e || !e.json) return null;
  const st = JSON.parse(e.json), r = remote.r;
  let rr = null; try { rr = r && r.json ? JSON.parse(r.json) : null; } catch (x) {}
  const ok = rr && rr.epoch === epochOf(st);
  st.results = (ok && rr.results) || {}; st.tb = (ok && rr.tb) || {};
  st.ts = Math.max(e.ts || 0, ok ? (r.ts || 0) : 0);
  if (ok && (r.ts || 0) > (e.ts || 0) && rr.updated) st.updated = rr.updated;
  return st;
}
function applyRemote() {
  const st = combineRemote();
  remoteExists = !!st;
  if (st) {
    /* estado y resultados llegan como dos eventos distintos (con la misma hora cuando los escribe la organización): se compara la combinación de ambas horas, no solo la mayor */
    const sig = ((remote.e && remote.e.ts) || 0) + '|' + ((remote.r && remote.r.ts) || 0);
    if (!dirty && sig !== lastSig) { state = ensure(st); lastTs = st.ts; lastSig = sig; setUpdated(); if (edit()) lastPub = lastPub || new Date(); }
    else if (!dirty) { lastSig = sig; setUpdated(); }
    reconcileLocal(st);
  } else { setUpdated(); if (org() && !dirty && booted) { dirty = true; dirtyR = true; save(true); } }
  render();
}
/* cambios guardados en este navegador que no alcanzaron a publicarse (se revisa una vez, al tener permisos) */
function reconcileLocal(st) {
  if (localChecked || !edit() || !booted) return;
  localChecked = true;
  let loc = null; try { const j = localStorage.getItem(LSKEY); loc = j ? JSON.parse(j) : null; } catch (e) {}
  st = st || combineRemote();
  if (!loc || !(loc.ts > (st ? st.ts : 0))) return;
  if (org() || !st) { if (!org()) return; state = ensure(loc); dirtyR = true; }
  else if (epochOf(loc) === epochOf(st)) { state = ensure(Object.assign({}, st, { results: loc.results || {}, tb: loc.tb || {}, ts: loc.ts, updated: loc.updated })); }
  else return;
  lastTs = state.ts; dirty = true; publish();
}
let remoteExists = false;
async function boot() {
  if (PUBLIC) { state = ensure(freshState()); render(); loadStatic(); return; }
  if (WEB) { state = ensure(freshState()); render(); bootWeb(); return; }
  state = ensure(tryLocal() || freshState());
  render();
  try {
    if (window.claude && claude.use) {
      const [db, user, dl] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('downloads')]);
      downloads = dl;
      if (user) { try { role = (await user.canEdit()) ? 'org' : 'viewer'; } catch (e) {} }
      if (db) {
        dbDoc = db.doc('torneo/estado');
        dbDoc.onSnapshot(snap => {
          if (!snap.exists) { if (org()) { save(); } return; }
          const d = snap.data() || {};
          if (d.ts && d.ts > (state.ts || 0) && d.ts !== lastTs) { try { state = ensure(JSON.parse(d.json)); lastTs = d.ts; syncMode = 'cloud'; render(); } catch (e) {} }
          else if (syncMode !== 'cloud') { syncMode = 'cloud'; render(); }
        }, () => {});
      }
      render();
    }
  } catch (e) { render(); }
}
setInterval(() => { if (tab === 'inicio' || tab === 'j1' || tab === 'j2') { const a = document.activeElement; if (!(a && a.classList && a.classList.contains('sc'))) render(); } }, 60000);
boot();
